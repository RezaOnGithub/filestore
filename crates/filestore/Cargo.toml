[package]
name = "filestore"
description = "Filestore catalog, scanner, and evidence interpretation (synchronous)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
getrandom = "0.4.3"
libc = "0.2.191"
rusqlite = { version = "0.41.0", features = ["bundled", "serde_json"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
